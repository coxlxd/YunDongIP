name: publish bonding v0.9-alpha1 binaries

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-bonding-v09-alpha1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HANDOFF_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3718-81f5-8494-584e7a7d1094/raw?se=2026-09-28T03%3A07%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=74866ed2-114c-5b43-a2ff-d61d42dd2145&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A12%3A58Z&ske=2026-09-29T00%3A12%3A58Z&sks=b&skv=2026-02-06&sig=xttI0NIggtzWK7w7G8ryI8Sf1YDMPAQ5J74l3LR8518%3D'
    steps:
      - name: Fetch binary-only handoff
        run: |
          mkdir release
          curl -fL "$HANDOFF_URL" -o handoff.zip
          unzip -q handoff.zip -d release
          ls -lh release

      - name: Regenerate public checksums
        run: |
          cd release
          sha256sum ydi-bond-v0.9-alpha1-linux-amd64 ydi-bond-v0.9-alpha1-windows-amd64.exe > SHA256SUMS.txt

      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view bonding-v0.9-alpha1 >/dev/null 2>&1; then
            gh release upload bonding-v0.9-alpha1 release/* --clobber
          else
            gh release create bonding-v0.9-alpha1 release/* \
              --target main \
              --title "YunDongIP Bonding v0.9-alpha1 Test" \
              --notes "Experimental binary-only test build. Source remains in the private development repository." \
              --prerelease
          fi
